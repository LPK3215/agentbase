app:
  name: agentbase
  env: dev
  log_level: INFO

model:
  provider: openai
  name: deepseek-chat
  temperature: 0
  max_tokens: null
  timeout_seconds: 120
  base_url: https://api.deepseek.com/v1
  api_key_env: DEEPSEEK_API_KEY
  extra: {}

backend:
  type: filesystem
  root_dir: workspace
  options: {}

checkpointer:
  type: postgres
  # For local dev: postgresql://agentbase:agentbase@127.0.0.1:5432/agentbase
  # For Docker:     postgresql://agentbase:agentbase@postgres:5432/agentbase
  dsn: postgresql://agentbase:agentbase@127.0.0.1:5432/agentbase
  options: {}

storage:
  # SQLite (dev/single-user) or PostgreSQL (prod/multi-user)
  type: postgres
  db_dir: data
  # For local dev: postgresql://agentbase:agentbase@127.0.0.1:5432/agentbase
  # For Docker:     postgresql://agentbase:agentbase@postgres:5432/agentbase
  dsn: postgresql://agentbase:agentbase@127.0.0.1:5432/agentbase

embedding:
  # Code default: none (disabled). This config overrides to hash for out-of-box RAG.
  # hash (zero-dep testing) | openai | none (text search only)
  # Register custom: @register_embedding_provider("name")
  provider: hash
  options: {}

web_search:
  # duckduckgo (no API key) | none (disabled)
  # Register custom: @register_search_provider("name")
  provider: none
  options: {}

runtime:
  default_agent: default
  config_dir: configs
  workspace_dir: workspace
  stream_modes:
    - messages
    - updates
  recursion_limit: 50
  max_concurrency: 4

extensions:
  autodiscover:
    - agentbase.extensions.tools
    - agentbase.extensions.middleware
    - agentbase.extensions.subagents
  extra_modules: []

# OAuth2 third-party login (Google/GitHub)
# Enable to allow users to log in via Google or GitHub accounts.
# Auto-registers new users or matches existing users by email.
# Requires user_manager.enabled=true for auto-registration.
# oauth2:
#   enabled: true
#   providers:
#     google:
#       client_id: "xxx.apps.googleusercontent.com"
#       client_secret: "${GOOGLE_OAUTH_SECRET}"
#       redirect_uri: "http://localhost:8000/auth/oauth2/google/callback"
#       scopes: ["openid", "email", "profile"]
#       default_roles: ["user"]
#     github:
#       client_id: "Iv1.xxx"
#       client_secret: "${GITHUB_OAUTH_SECRET}"
#       redirect_uri: "http://localhost:8000/auth/oauth2/github/callback"
#       scopes: ["user:email"]
#       default_roles: ["user"]

# Token usage tracking and cost statistics
# Enable to record prompt/completion/total tokens + estimated USD cost
# for every model invocation. Provides /usage/* API endpoints.
# usage:
#   enabled: true
#   provider: memory
#   max_records: 100000
#   pricing: {}  # optional custom pricing table (model -> {prompt, completion} per 1K tokens)

# Webhook event notification service
# Enable to register endpoints and receive HTTP POST notifications
# for agent lifecycle events (invoke/stream/resume completed).
# webhook:
#   enabled: true
#   provider: memory
#   timeout_seconds: 10.0
#   max_retries: 3
#   retry_backoff: 1.0

# User feedback collection
# Enable to record user ratings (1-5 stars or thumbs up/down),
# comments, and tags for agent responses. Provides /feedback/* API.
# feedback:
#   enabled: true
#   provider: memory
#   max_records: 50000

# Notification center — in-app notification management
# Enable to create, query, and manage user notifications
# (system announcements, quota alerts, task completion, etc.).
# Provides /notifications/* API endpoints.
# notification:
#   enabled: true
#   provider: memory
#   max_records: 100000

# Conversation history service
# Enable to record and query conversation message history for
# agent invoke/stream/resume operations. Provides /conversations/* API.
# conversation:
#   enabled: true
#   provider: memory
#   max_conversations: 10000

# Scheduled task service — cron / interval agent invocation
# Enable to run recurring agent tasks (daily reports, periodic checks).
# schedule_type: "interval" (every N seconds) or "cron" (5-field
# expression "min hour dom mon dow", e.g. "0 8 * * *" = daily 08:00).
# Provides /schedules/* API endpoints (create/pause/resume/trigger/runs).
# scheduler:
#   enabled: true
#   provider: memory  # memory (default) | custom via @register_schedule_provider
#   tick_seconds: 1.0  # how often due tasks are checked
#   max_workers: 4     # concurrent task executions
#   max_tasks: 1000    # max stored tasks before FIFO eviction
#   max_runs: 10000    # max stored run records before FIFO eviction

# Calendar / event management service
# Enable to create, query, update, and delete calendar events
# (meetings, reminders, personal schedules). Provides /calendar/* API
# endpoints and calendar_* agent tools (add to agent config `tools:`).
# calendar:
#   enabled: true
#   provider: memory  # memory (default) | custom via @register_calendar_provider
#   max_events: 10000 # max stored events before FIFO eviction

# System config service (runtime hot-reloadable key/value settings)
# Enable to manage feature flags / tunables at runtime without restart.
# Provides /system-config/* API endpoints and system_config_* agent tools (read-only).
# system_config:
#   enabled: true
#   provider: memory  # memory (default) | custom via @register_system_config_provider
#   max_items: 1000   # max stored entries before FIFO eviction

# RBAC service (runtime role/permission management)
# Enable to manage custom roles and user-role assignments at runtime.
# Provides /rbac/* API endpoints and rbac_* agent tools (read-only).
# Seeds three protected system roles aligned with DEFAULT_ROLE_PERMISSIONS:
#   admin = ["*"], user = ["*:read","*:write","*:invoke"], readonly = ["*:read"]
# rbac:
#   enabled: true
#   provider: memory          # memory (default) | custom via @register_rbac_provider
#   seed_system_roles: true   # create admin/user/readonly system roles on init

# Audit log service
# Enable to record structured audit events (who/when/what/result).
# Provides /audit/events/* query + export API. Supports JSON/CSV/YAML export.
# audit:
#   enabled: true
#   provider: sqlite  # sqlite (default) | custom via @register_audit_provider
#   db_dir: data       # SQLite database directory
#   # dsn: postgresql://...  # Override to use PostgreSQL/MySQL for audit

# A/B testing experiment framework
# Enable to compare agent strategies (model/prompt/temperature).
# Provides /experiments/* API with round_robin/weighted/random assignment.
# experiment:
#   enabled: true
#   provider: memory

# Sensitive information redaction service
# Enable to mask PII (API keys, phone numbers, emails, IDs) in text.
# Works with redact_output middleware to mask model outputs.
# redaction:
#   enabled: true
#   provider: regex  # regex (default, zero-dep) | custom via @register_redaction_provider

# Secrets encryption service
# Enable to encrypt secrets (API keys, etc.) at rest instead of plaintext config.
# Uses Fernet symmetric encryption with a local key file.
# secrets:
#   enabled: true
#   provider: fernet  # fernet (default) | env (read from env vars)
#   key_file: .secret_key
#   secrets_file: .secrets.json

# Model management service
# Enable multi-model CRUD and connectivity testing.
# Provides /models/* API (6 routes).
# model_manager:
#   enabled: true
#   provider: memory

# Prompt template management service
# Enable prompt template CRUD and variable rendering.
# Provides /prompts/* API (6 routes).
# prompt_manager:
#   enabled: true
#   provider: memory

# User management service
# Enable user CRUD, password hashing (PBKDF2-HMAC-SHA256), and authentication.
# Provides /users/* and /auth/register, /auth/login API (7 routes).
# user_manager:
#   enabled: true
#   provider: memory

# API Key management service
# Enable multi-key CRUD, revocation, verification, and usage statistics.
# Integrates with Bearer token authentication. Provides /apikeys/* API (7 routes).
# apikey_manager:
#   enabled: true
#   provider: memory

# Database migration (Alembic)
# Enabled by default. CLI: agentbase db init/upgrade/downgrade/current/heads/history/stamp
# migration:
#   enabled: true
#   scripts_dir: migrations
