[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentbase"
version = "0.4.0"
description = "Deep Agents backend harness for secondary development"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.3.5",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langgraph>=0.4.0",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0.1",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "typing-extensions>=4.12.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "sse-starlette>=2.0.0",
  # tzdata is required on Windows (and bundled-free Linux builds) for
  # `zoneinfo` to resolve IANA timezone keys such as "America/New_York".
  "tzdata>=2024.1",
]

[project.optional-dependencies]
postgres = [
  "langgraph-checkpoint-postgres>=2.0.0",
  "psycopg[binary]>=3.2.0",
]
api = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "sse-starlette>=2.0.0",
  "httpx>=0.27.0",
]
openai = ["langchain-openai>=0.3.0"]
anthropic = ["langchain-anthropic>=0.3.0"]
google = ["langchain-google-genai>=2.0.0"]
embeddings = [
  "openai>=1.0.0",
  "sentence-transformers>=2.7.0",
]
search = [
  "tavily-python>=0.5.0",
]
rag = [
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "beautifulsoup4>=4.12.0",
  "openpyxl>=3.1.0",
  "python-pptx>=0.6.23",
]
queue = [
  "redis>=5.0.0",
]
tracing = [
  "langfuse>=2.0.0",
]
ocr = [
  "pytesseract>=0.3.10",
  "pillow>=10.0.0",
  "pdf2image>=1.17.0",
]
graph = [
  "neo4j>=5.0.0",
]
mysql = [
  "pymysql>=1.1.0",
]
secrets = [
  "cryptography>=42.0.0",
]
otel = [
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "opentelemetry-exporter-otlp>=1.20.0",
]
transcribe = [
  "openai-whisper>=20231117",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "isort>=5.13.0",
  "pip-audit>=2.7.0",
]
all = [
  "agentbase[postgres,api,openai,anthropic,google,embeddings,search,rag,queue,tracing,ocr,graph,mysql,otel,transcribe]",
]

[project.scripts]
agentbase = "agentbase.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbase"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agentbase --cov-report=term-missing --cov-fail-under=60"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.isort]
profile = "black"
line_length = 120
