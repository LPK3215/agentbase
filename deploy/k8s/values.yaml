# Default values for agentbase Helm Chart
# This is a YAML-formatted file.

# -- Number of API replicas
replicaCount: 1

image:
  # -- Image repository
  repository: agentbase
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Image tag
  tag: "0.4.0"

# -- Image pull secrets
imagePullSecrets: []

# -- Override chart name
nameOverride: ""
fullnameOverride: ""

# -- API service configuration
api:
  # -- API Key for authentication (empty = disabled)
  apiKey: ""
  # -- CORS allowed origins
  corsOrigins: "*"
  # -- Environment (dev, staging, prod)
  env: prod
  # -- Log level
  logLevel: INFO
  # -- Model API keys (set via --set or values file)
  siliconflowApiKey: ""
  openaiApiKey: ""
  deepseekApiKey: ""

# -- PostgreSQL configuration
postgres:
  # -- Enable PostgreSQL subchart
  enabled: true
  # -- Database name
  database: agentbase
  # -- Database user
  user: agentbase
  # -- Database password
  password: agentbase
  # -- Storage size
  storageSize: 10Gi
  # -- Image
  image: pgvector/pgvector:pg16

# -- Redis configuration
redis:
  # -- Enable Redis subchart
  enabled: true
  # -- Redis password (empty = no auth)
  password: ""
  # -- Storage size
  storageSize: 5Gi

# -- Service configuration
service:
  type: ClusterIP
  port: 8000

# -- Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agentbase.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- Resource limits
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 256Mi

# -- Probe configuration
probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

# -- Node selector
nodeSelector: {}

# -- Tolerations
tolerations: []

# -- Affinity rules — prefer not to co-locate API pods on same node
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: agentbase
          topologyKey: kubernetes.io/hostname

# -- Pod annotations
podAnnotations: {}

# -- Pod security context
podSecurityContext:
  fsGroup: 1000

# -- Container security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
