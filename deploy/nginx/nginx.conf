# Nginx reverse proxy configuration for agentbase
# 
# Usage:
#   1. Copy to /etc/nginx/sites-available/agentbase
#   2. ln -s /etc/nginx/sites-available/agentbase /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#
# Or use with Docker:
#   docker run -v $(pwd)/nginx.conf:/etc/nginx/nginx.conf:ro -p 80:80 nginx

upstream agentbase_api {
    server 127.0.0.1:8000;
    # For multiple instances:
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
}

server {
    listen 80;
    server_name agentbase.local _;

    # Client body size for file uploads (documents)
    client_max_body_size 100m;

    # Timeouts for long-running agent calls
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=agentbase_limit:10m rate=10r/s;

    # Main API proxy
    location / {
        limit_req zone=agentbase_limit burst=20 nodelay;
        
        proxy_pass http://agentbase_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check (no rate limit)
    location /health {
        proxy_pass http://agentbase_api;
        access_log off;
    }

    # Metrics (no rate limit)
    location /metrics {
        proxy_pass http://agentbase_api;
        access_log off;
    }

    # Static docs
    location /docs {
        proxy_pass http://agentbase_api;
    }
    location /redoc {
        proxy_pass http://agentbase_api;
    }

    # SSE streaming — disable buffering
    location ~ ^/agents/.*/stream$ {
        proxy_pass http://agentbase_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://agentbase_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

